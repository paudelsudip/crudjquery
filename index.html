<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Grocery Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Vanilla Tilt Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
  <script src="js/app.js"></script>

</head>
<body>

  <div class="lock-screen">
    <div class="lock-content">
      <h1>🔐 Restricted Area</h1>
      <p>Drag the Key and click to the Lock to Enter</p>
      
      <div class="lock-zone">
        <div class="keyhole-zone">🔒</div>
        <div class="key" draggable="true">🔑</div>
      </div>
      
      <div class="welcome-message">You are Welcomed!</div>
    </div>
  </div>

  <div class="container">
    <div class="app">
      <div class="header-row">
        <h2>Smart Grocery Manager</h2>
        <button id="lock-btn" title="Lock App">🔒</button>
      </div>

      <div class="input-box">
        <input type="text" placeholder="Add grocery item...">
        <button>Add</button>
      </div>

      <ul class="list">
        <!-- Items added dynamically -->
      </ul>
    </div>

    <div class="footer">
      Designed by Sudip
    </div>
  </div>

</body>
</html>
